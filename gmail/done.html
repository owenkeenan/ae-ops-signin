<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gmail and AE Operations</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #1f3a5f; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; }
    h1 { font-size: 20px; margin: 0 0 16px; color: #1f3a5f; }
    .error { background: #fef2f2; color: #b91c1c; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
    .muted { color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card" id="app"></main>
  <script>
    // Google sends people here after the Gmail sign-in link from the chat (connect_gmail).
    const p = new URLSearchParams(location.search);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const app = document.getElementById('app');
    app.innerHTML = p.get('gmail') === 'connected'
      ? `<h1>Gmail connected</h1><p>AE Operations now reads, files, drafts and sends email as <b>${esc(p.get('email'))}</b>.</p><p class="muted">You can close this tab and go back to the chat.</p>`
      : `<h1>Gmail isn't connected</h1><p class="error">${esc(p.get('reason') || 'The sign-in did not finish.')}</p><p class="muted">Ask in the chat for a new link (connect_gmail).</p>`;
  </script>
</body>
</html>
