<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Approve: AE Operations</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #1f3a5f; color: #1e293b; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 560px; }
    h1 { font-size: 20px; margin: 0 0 8px; color: #1f3a5f; }
    h2 { font-size: 16px; margin: 20px 0 8px; color: #1f3a5f; text-transform: capitalize; }
    .item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-top: 12px; }
    .text { white-space: pre-wrap; font-size: 14px; line-height: 1.45; }
    textarea { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; font-size: 14px; }
    button { padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 15px; cursor: pointer; background: #f8fafc; }
    button.primary { background: #1f3a5f; color: #fff; border-color: #1f3a5f; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .error { background: #fef2f2; color: #b91c1c; padding: 10px 12px; border-radius: 8px; font-size: 14px; white-space: pre-wrap; }
    .ok { background: #f0fdf4; color: #166534; padding: 10px 12px; border-radius: 8px; font-size: 14px; white-space: pre-wrap; }
    .muted { color: #64748b; font-size: 13px; }
    a { color: #1f3a5f; }
  </style>
</head>
<body>
  <main class="card" id="app"><p>Loading…</p></main>
  <script type="module">
    // Opened from the "Approve" link on a Fee (?fee=26406-1) or a Document Register record (?document=<page id>).
    // The connector checks who is signed in and what they may approve; this page only shows and asks.
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const SUPABASE_URL = 'https://itaahajysrmtzfvlzbvu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0YWFoYWp5c3JtdHpmdmx6YnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MzEwOTAsImV4cCI6MjExMDAwNzA5MH0.YajNSb52QSFwZMXj0qlELDouFUGGl6ZIp3cxb3kFzPM';
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'pkce', detectSessionInUrl: true } });
    const app = document.getElementById('app');
    const params = new URLSearchParams(location.search);
    const fee = params.get('fee');
    const doc = params.get('document');
    const server = params.get('server') === 'ae-ops-staging' ? 'ae-ops-staging' : 'ae-ops';
    const api = `${SUPABASE_URL}/functions/v1/${server}/approvals`;
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const linkify = (s) => esc(s).replace(/(https:\/\/[^\s|)]+)/g, '<a href="$1" target="_blank" rel="noopener">open</a>');
    const here = () => `${location.origin}${location.pathname}?${fee ? `fee=${encodeURIComponent(fee)}` : `document=${encodeURIComponent(doc ?? '')}`}${server === 'ae-ops-staging' ? '&server=ae-ops-staging' : ''}`;

    function signIn(msg) {
      app.innerHTML = `<h1>Approve</h1>${msg ? `<p class="error">${esc(msg)}</p>` : ''}
        <p>Sign in with your Asset Engineers Google account to see what's waiting for approval.</p>
        <button class="primary" id="g">Sign in with Google</button>`;
      document.getElementById('g').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: here(), queryParams: { hd: 'assetengineers.com.au', prompt: 'select_account' } } });
    }

    async function load() {
      if (!fee && !doc) { app.innerHTML = '<h1>Approve</h1><p class="error">Open this page from an Approve link in Notion.</p>'; return; }
      const { data: s } = await sb.auth.getSession();
      if (params.has('code')) history.replaceState(null, '', here());
      if (!s.session) return signIn(params.get('error_description'));
      const token = s.session.access_token;
      const r = await fetch(`${api}/view?${fee ? `fee=${encodeURIComponent(fee)}` : `document=${encodeURIComponent(doc)}`}`, { headers: { Authorization: `Bearer ${token}` } });
      const v = await r.json().catch(() => ({}));
      if (!r.ok) return signIn(v.error_description || v.error || `Couldn't load (${r.status}).`);
      if (!v.items?.length) { app.innerHTML = `<h1>Approve ${esc(fee ?? 'document')}</h1><p>Nothing on this ${fee ? 'fee' : 'record'} is waiting: no draft quote or unsent invoice.</p>`; return; }
      app.innerHTML = `<h1>Approve ${esc(fee ? `fee ${fee}` : 'document')}</h1>
        <p class="muted">Signed in as ${esc(v.who)}. ${v.canApprove ? 'Approving covers exactly this version; any later change needs approving again.' : "You can see this, but you don't have approval rights for it."}</p>
        ${v.items.map((it, i) => `<div class="item"><h2>${esc(it.kind)}</h2><div class="text">${linkify(it.text)}</div>
          ${v.canApprove ? `<textarea id="note${i}" rows="2" placeholder="Note (needed to send back)"></textarea>
          <div class="row"><button class="primary" data-i="${i}" data-d="approve">Approve</button><button data-i="${i}" data-d="send_back">Send back</button></div>
          <div id="out${i}"></div>` : ''}</div>`).join('')}`;
      for (const b of app.querySelectorAll('button[data-i]')) {
        b.onclick = async () => {
          const i = Number(b.dataset.i), it = v.items[i], decision = b.dataset.d;
          const note = document.getElementById(`note${i}`).value.trim();
          if (decision === 'send_back' && note.length < 5) { document.getElementById(`out${i}`).innerHTML = '<p class="error">Say what needs changing in the note first.</p>'; return; }
          if (!confirm(`${decision === 'approve' ? 'Approve' : 'Send back'} this ${it.kind}?`)) return;
          for (const x of app.querySelectorAll('button[data-i]')) x.disabled = true;
          const res = await fetch(`${api}/decide`, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: it.kind, fee, document: doc, decision, note }) }).then((x) => x.json()).catch(() => ({ ok: false, text: 'The connector did not answer.' }));
          document.getElementById(`out${i}`).innerHTML = `<p class="${res.ok ? 'ok' : 'error'}">${linkify(res.text)}</p>`;
          if (!res.ok) for (const x of app.querySelectorAll('button[data-i]')) x.disabled = false;
        };
      }
    }

    load().catch((e) => { app.innerHTML = `<p class="error">${esc(e.message || e)}</p>`; });
  </script>
</body>
</html>
